<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>تفاصيل الباكدج | مستر توحيد</title>

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <div class="container">

            <a href="index.html" class="logo">

                <span class="logo-mark">
                    MT
                </span>

                <div class="logo-text">

                    <strong>
                        مستر توحيد
                    </strong>

                    <small>
                        للملابس
                    </small>

                </div>

            </a>


            <nav class="nav">

                <a href="index.html">
                    الرئيسية
                </a>

                <a href="index.html#packages">
                    الباكدجات
                </a>

                <a href="index.html#about">
                    من نحن
                </a>

                <a href="index.html#contact">
                    تواصل معنا
                </a>

            </nav>


            <button class="menu-btn" type="button">
                ☰
            </button>

        </div>

    </header>



    <!-- =========================
         PRODUCT DETAILS
    ========================== -->

    <main>

        <section class="product-details">

            <div class="container">

                <div class="product-layout">


                    <!-- =========================
                         IMAGES
                    ========================== -->

                    <div class="product-images">


                        <!-- MAIN IMAGE -->

                        <div class="product-image">

                            <img id="productImage" src="package-1.jpg" alt="الباكدج">

                        </div>


                        <!-- GALLERY -->

                        <div class="product-gallery" id="productGallery">

                            <!-- الصور الصغيرة هتظهر هنا من Firebase -->

                        </div>


                    </div>



                    <!-- =========================
                         INFORMATION
                    ========================== -->

                    <div class="product-info">


                        <span class="product-label">
                            باكدج مميز
                        </span>


                        <!-- NAME -->

                        <h1 id="productName">
                            باكدج البداية
                        </h1>


                        <!-- PRICE -->

                        <div class="product-price" id="productPrice">
                            2500 جنيه
                        </div>


                        <!-- DESCRIPTION -->

                        <p class="product-description" id="productDescription">

                            باكدج متكامل مناسب
                            لمجموعة من المنتجات.

                        </p>



                        <!-- =========================
                             PRODUCTS INSIDE PACKAGE
                        ========================== -->

                        <div class="package-products">


                            <h2>
                                المنتجات الموجودة داخل الباكدج
                            </h2>


                            <div id="packageProductsList" class="package-products-list">

                                <!-- المنتجات هتظهر هنا من Firebase -->

                            </div>


                        </div>



                        <!-- =========================
                             FEATURES
                        ========================== -->

                        <div class="package-includes">

                            <h2>
                                تفاصيل الباكدج
                            </h2>


                            <ul id="productFeatures">

                                <!-- التفاصيل هتظهر هنا -->

                            </ul>

                        </div>



                        <!-- =========================
                             ORDER
                        ========================== -->

                        <a href="order.html?id=1" class="btn order-btn" id="orderButton">
                            اطلب الآن
                        </a>


                    </div>


                </div>

            </div>

        </section>

    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="footer">

        <div class="container">

            <div class="copyright">

                جميع الحقوق محفوظة © 2026 مستر توحيد

            </div>

        </div>

    </footer>



    <script type="module" src="main.js"></script>


</body>

</html>
