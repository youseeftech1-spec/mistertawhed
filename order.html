<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>تأكيد الطلب | مستر توحيد</title>

</head>


<body>


    <!-- HEADER -->

    <header class="header">

        <div class="container">

            <a href="index.html" class="logo">

                <span class="logo-mark">MT</span>

                <div class="logo-text">

                    <strong>مستر توحيد</strong>

                    <small>للملابس</small>

                </div>

            </a>


            <nav class="nav">

                <a href="index.html">
                    الرئيسية
                </a>

                <a href="index.html#packages">
                    الباكدجات
                </a>

                <a href="index.html#about">
                    من نحن
                </a>

                <a href="index.html#contact">
                    تواصل معنا
                </a>

            </nav>


            <button class="menu-btn" type="button">
                ☰
            </button>

        </div>

    </header>



    <!-- ORDER -->

    <main>

        <section class="order-section">

            <div class="container">

                <div class="section-heading">

                    <span>
                        خطوة واحدة تفصلك عن طلبك
                    </span>

                    <h1>
                        تأكيد الطلب
                    </h1>

                    <p>
                        أدخل بياناتك وسنتواصل معك لتأكيد الطلب.
                    </p>

                </div>



                <div class="order-layout">


                    <!-- ORDER FORM -->

                    <div class="order-form-box">

                        <h2>
                            بيانات العميل
                        </h2>


                        <form id="orderForm">


                            <div class="form-group">

                                <label for="name">
                                    الاسم الكامل
                                </label>

                                <input type="text" id="name" name="name" placeholder="أدخل اسمك الكامل" required>

                            </div>



                            <div class="form-group">

                                <label for="phone">
                                    رقم الهاتف
                                </label>

                                <input type="tel" id="phone" name="phone" placeholder="أدخل رقم الهاتف" required>

                            </div>



                            <div class="form-group">

                                <label for="governorate">
                                    المحافظة
                                </label>

                                <select id="governorate" name="governorate" required>

                                    <option value="">
                                        اختر المحافظة
                                    </option>

                                    <option>القاهرة</option>
                                    <option>الجيزة</option>
                                    <option>القليوبية</option>
                                    <option>الإسكندرية</option>
                                    <option>الشرقية</option>
                                    <option>الدقهلية</option>
                                    <option>الغربية</option>
                                    <option>المنوفية</option>
                                    <option>البحيرة</option>
                                    <option>الإسماعيلية</option>
                                    <option>السويس</option>
                                    <option>بورسعيد</option>
                                    <option>دمياط</option>
                                    <option>الفيوم</option>
                                    <option>بني سويف</option>
                                    <option>المنيا</option>
                                    <option>أسيوط</option>
                                    <option>سوهاج</option>
                                    <option>قنا</option>
                                    <option>الأقصر</option>
                                    <option>أسوان</option>
                                    <option>مطروح</option>
                                    <option>الوادي الجديد</option>
                                    <option>البحر الأحمر</option>
                                    <option>شمال سيناء</option>
                                    <option>جنوب سيناء</option>

                                </select>

                            </div>



                            <div class="form-group">

                                <label for="address">
                                    العنوان بالتفصيل
                                </label>

                                <textarea id="address" name="address" placeholder="أدخل العنوان بالتفصيل" rows="4"
                                    required></textarea>

                            </div>



                            <div class="form-group">

                                <label for="notes">
                                    ملاحظات إضافية
                                </label>

                                <textarea id="notes" name="notes" placeholder="أي ملاحظات إضافية..."
                                    rows="3"></textarea>

                            </div>



                            <button type="submit" class="btn submit-btn">
                                تأكيد الطلب
                            </button>


                        </form>

                    </div>



                    <!-- ORDER SUMMARY -->

                    <div class="order-summary">

                        <h2>
                            ملخص الطلب
                        </h2>


                        <div class="summary-image">

                            <img id="summaryImage" src="package-1.jpg" alt="باكدج البداية">

                        </div>


                        <h3 id="summaryName">
                            باكدج البداية
                        </h3>


                        <p id="summaryDescription">
                            دستين + موقع إلكتروني + لوجو
                        </p>


                        <div class="summary-price">

                            <span>
                                الإجمالي
                            </span>

                            <strong id="summaryPrice">
                                2500 جنيه
                            </strong>

                        </div>


                    </div>


                </div>

            </div>

        </section>

    </main>



    <!-- FOOTER -->

    <footer class="footer">

        <div class="container">

            <div class="copyright">

                جميع الحقوق محفوظة © 2026 مستر توحيد

            </div>

        </div>

    </footer>


<script type="module" src="main.js"></script>
</body>

</html>
