<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

    ```
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>تأكيد الطلب | مستر توحيد</title>
    ```

</head>

<body>

    ```
    <!-- HEADER -->

    <header class="header">

        <div class="container">

            <a href="index.html" class="logo">

                <span class="logo-mark">MT</span>

                <div class="logo-text">

                    <strong>مستر توحيد</strong>

                    <small>للملابس</small>

                </div>

            </a>


            <nav class="nav">

                <a href="index.html">
                    الرئيسية
                </a>

                <a href="index.html#packages">
                    الباكدجات
                </a>

                <a href="index.html#about">
                    من نحن
                </a>

                <a href="index.html#contact">
                    تواصل معنا
                </a>

            </nav>


            <button class="menu-btn" type="button">
                ☰
            </button>

        </div>

    </header>



    <!-- ORDER -->

    <main>

        <section class="order-section">

            <div class="container">

                <div class="section-heading">

                    <span>
                        خطوة واحدة تفصلك عن طلبك
                    </span>

                    <h1>
                        تأكيد الطلب
                    </h1>

                    <p>
                        أدخل بياناتك وسنتواصل معك لتأكيد الطلب.
                    </p>

                </div>



                <div class="order-layout">


                    <!-- ORDER FORM -->

                    <div class="order-form-box">

                        <h2>
                            بيانات العميل
                        </h2>


                        <form id="orderForm">


                            <div class="form-group">

                                <label for="name">
                                    الاسم الكامل
                                </label>

                                <input type="text" id="name" name="name" placeholder="أدخل اسمك الكامل" required>

                            </div>



                            <div class="form-group">

                                <label for="phone">
                                    رقم الهاتف
                                </label>

                                <input type="tel" id="phone" name="phone" placeholder="أدخل رقم الهاتف" required>

                            </div>



                            <div class="form-group">

                                <label for="governorate">
                                    المحافظة
                                </label>

                                <select id="governorate" name="governorate" required>

                                    <option value="">
                                        اختر المحافظة
                                    </option>

                                    <option value="القاهرة">القاهرة</option>
                                    <option value="الجيزة">الجيزة</option>
                                    <option value="القليوبية">القليوبية</option>
                                    <option value="الإسكندرية">الإسكندرية</option>
                                    <option value="الشرقية">الشرقية</option>
                                    <option value="الدقهلية">الدقهلية</option>
                                    <option value="الغربية">الغربية</option>
                                    <option value="المنوفية">المنوفية</option>
                                    <option value="البحيرة">البحيرة</option>
                                    <option value="الإسماعيلية">الإسماعيلية</option>
                                    <option value="السويس">السويس</option>
                                    <option value="بورسعيد">بورسعيد</option>
                                    <option value="دمياط">دمياط</option>
                                    <option value="الفيوم">الفيوم</option>
                                    <option value="بني سويف">بني سويف</option>
                                    <option value="المنيا">المنيا</option>
                                    <option value="أسيوط">أسيوط</option>
                                    <option value="سوهاج">سوهاج</option>
                                    <option value="قنا">قنا</option>
                                    <option value="الأقصر">الأقصر</option>
                                    <option value="أسوان">أسوان</option>
                                    <option value="مطروح">مطروح</option>
                                    <option value="الوادي الجديد">الوادي الجديد</option>
                                    <option value="البحر الأحمر">البحر الأحمر</option>
                                    <option value="شمال سيناء">شمال سيناء</option>
                                    <option value="جنوب سيناء">جنوب سيناء</option>

                                </select>

                            </div>



                            <div class="form-group">

                                <label for="address">
                                    العنوان بالتفصيل
                                </label>

                                <textarea id="address" name="address" placeholder="أدخل العنوان بالتفصيل" rows="4"
                                    required></textarea>

                            </div>



                            <div class="form-group">

                                <label for="notes">
                                    ملاحظات إضافية
                                </label>

                                <textarea id="notes" name="notes" placeholder="أي ملاحظات إضافية..."
                                    rows="3"></textarea>

                            </div>



                            <button type="submit" class="btn submit-btn">
                                تأكيد الطلب
                            </button>


                        </form>

                    </div>



                    <!-- ORDER SUMMARY -->

                    <div class="order-summary">

                        <h2>
                            ملخص الطلب
                        </h2>


                        <div class="summary-image">

                            <img id="summaryImage" alt="صورة الباكدج المختار">

                        </div>


                        <h3 id="summaryName"></h3>


                        <p id="summaryDescription"></p>


                        <div class="summary-price">

                            <span>
                                الإجمالي
                            </span>

                            <strong id="summaryPrice"></strong>

                        </div>


                    </div>


                </div>

            </div>

        </section>

    </main>



    <!-- FOOTER -->

    <footer class="footer">

        <div class="container">

            <div class="copyright">

                جميع الحقوق محفوظة © 2026 مستر توحيد

            </div>

        </div>

    </footer>


    <script type="module" src="main.js"></script>
    ```

</body>

</html>
